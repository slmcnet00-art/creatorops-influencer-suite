services:
  - type: web
    name: creatorops-influencer-suite
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_CREATOROPS_API_BASE_URL
        fromService:
          type: web
          name: creatorops-suite-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_APP_URL
        value: https://creatorops-influencer-suite.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_WORKSPACE_ID
        value: miping-main
  - type: web
    name: creatorops-suite-api
    runtime: node
    buildCommand: npm install && npx playwright install chromium
    startCommand: npm run api:dev
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CORS_ORIGIN
        value: https://creatorops-influencer-suite.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: FRONTEND_URL
        value: https://creatorops-influencer-suite.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WORKSPACE_ID
        value: miping-main
      - key: YOUTUBE_DATA_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_CX
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_COMMERCIAL_ACCESS_TOKEN
        sync: false
      - key: TIKTOK_COMMERCIAL_DATE_WINDOW_DAYS
        value: 365
      - key: PUBLIC_SNAPSHOT_ENABLED
        value: true
      - key: PUBLIC_SNAPSHOT_TIMEOUT_MS
        value: 8000
      - key: INSTAGRAM_RENDER_SNAPSHOT_ENABLED
        value: true
      - key: INSTAGRAM_RENDER_TIMEOUT_MS
        value: 30000
      - key: INSTAGRAM_RENDER_WAIT_MS
        value: 8000
      - key: INSTAGRAM_RENDER_API_URL
        sync: false
      - key: INSTAGRAM_RENDER_API_KEY
        sync: false
      - key: BROWSERLESS_TOKEN
        sync: false
      - key: BROWSERLESS_CONTENT_URL
        value: https://production-sfo.browserless.io/content
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: OUTREACH_BATCH_LIMIT
        value: 20
      - key: OUTREACH_SEND_INTERVAL_MS
        value: 10000
      - key: OUTREACH_DAILY_LIMIT_PER_CAMPAIGN
        value: 50
      - key: CRON_SECRET
        sync: false
      - key: AUTOMATION_TRACKING_LIMIT
        value: 100
